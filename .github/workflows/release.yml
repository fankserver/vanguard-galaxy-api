name: Prerelease assets

on:
  # Unlike prereleased, published also fires when a draft becomes a prerelease.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.release.prerelease
    # Requires lawful local references; never run untrusted PR code here.
    runs-on: [self-hosted, linux, vgmodapi-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check, build and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: bash tools/release.sh "$TAG"
