name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Measure Core and Abstractions without game references
        run: |
          test ! -e VGModAPI/lib
          # Debug retains symbols; binary checks must inspect uninstrumented assemblies.
          make test CONFIGURATION=Debug GAME_DIR=/nonexistent/vgmodapi-game
          rm -rf artifacts/coverage
          make test CONFIGURATION=Debug GAME_DIR=/nonexistent/vgmodapi-game TEST_EXCLUDE_CATEGORY=BinaryInspection \
            TEST_ARGS="--no-build --collect:'XPlat Code Coverage' --results-directory artifacts/coverage/raw \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include='[VGModAPI.Core]*,[VGModAPI.Abstractions]*' \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeAssembliesWithoutSources=None"
          # ExcludeAssembliesWithoutSources=None accepts deterministic /src PDB paths.
          test ! -e VGModAPI/lib
      - name: Validate coverage and generate badge
        shell: python
        run: |
          import json, shutil
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = Path('artifacts/coverage')
          reports = list((output / 'raw').glob('*/coverage.cobertura.xml'))
          if len(reports) != 1:
              raise ValueError('Expected exactly one fresh coverage report')
          root = ET.parse(reports[0]).getroot()
          packages = root.findall('./packages/package')
          if len(packages) != 2 or {p.get('name') for p in packages} != {'VGModAPI.Core', 'VGModAPI.Abstractions'}:
              raise ValueError('Expected Core + Abstractions coverage only')
          counts = {}
          for kind in ('lines', 'branches'):
              covered, valid = (int(root.attrib[f'{kind}-{key}']) for key in ('covered', 'valid'))
              if not 0 <= covered <= valid or valid <= 0:
                  raise ValueError(f'Invalid or empty {kind} coverage')
              counts[kind] = {'covered': covered, 'valid': valid, 'percent': 100 * covered / valid}
          value = f"{counts['lines']['percent']:.2f}%"
          label = 'Core + Abstractions coverage'
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="20" role="img" aria-label="{label}: {value}">
          <title>{label}: {value}</title><rect width="256" height="20" rx="3" fill="#555"/>
          <path fill="#007ec6" d="M198 0h55a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3h-55z"/>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
          <text x="99" y="14">{label}</text><text x="227" y="14">{value}</text></g></svg>'''
          (output / 'badge.svg').write_text(svg, encoding='utf-8')
          (output / 'summary.json').write_text(json.dumps(counts, indent=2) + '\n', encoding='utf-8')
          shutil.copyfile(reports[0], output / 'coverage.cobertura.xml')
          print(json.dumps(counts))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            artifacts/coverage/badge.svg
            artifacts/coverage/summary.json
            artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: measure
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage-report
      - name: Publish measured main coverage to the coverage branch
        env:
          REPORT: ${{ runner.temp }}/coverage-report
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote=$(git ls-remote --heads origin coverage)
          if [ -n "$remote" ]; then
            git fetch origin coverage
            git checkout -B coverage FETCH_HEAD
          else
            git switch --orphan coverage
          fi
          cp "$REPORT/badge.svg" "$REPORT/summary.json" "$REPORT/coverage.cobertura.xml" .
          printf '%s\n' "$SOURCE_SHA" > source-revision.txt
          git add badge.svg summary.json coverage.cobertura.xml source-revision.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage for $SOURCE_SHA"
            git push origin HEAD:coverage
          fi
