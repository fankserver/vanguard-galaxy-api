name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Measure Core and Abstractions without game references
        run: |
          test ! -e VGModAPI/lib
          make coverage GAME_DIR=/nonexistent/vgmodapi-game
          test ! -e VGModAPI/lib
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            artifacts/coverage/badge.svg
            artifacts/coverage/summary.json
            artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: measure
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage-report
      - name: Publish measured main coverage to the coverage branch
        env:
          REPORT: ${{ runner.temp }}/coverage-report
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote=$(git ls-remote --heads origin coverage)
          if [ -n "$remote" ]; then
            git fetch origin coverage
            git checkout -B coverage FETCH_HEAD
          else
            git switch --orphan coverage
          fi
          cp "$REPORT/badge.svg" "$REPORT/summary.json" "$REPORT/coverage.cobertura.xml" .
          printf '%s\n' "$SOURCE_SHA" > source-revision.txt
          git add badge.svg summary.json coverage.cobertura.xml source-revision.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage for $SOURCE_SHA"
            git push origin HEAD:coverage
          fi
